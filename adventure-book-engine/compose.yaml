version: '3.8'

services:
  adventure-backend:
    build:
      context: ./adventure-book-engine
      dockerfile: Dockerfile
    container_name: adventure-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3