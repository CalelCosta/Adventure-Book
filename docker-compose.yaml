version: '3.8'

services:
  adventure-backend:
    build:
      context: ./adventure-book-engine
      dockerfile: Dockerfile
    container_name: adventure-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped

  adventure-frontend:
    build:
      context: ./adventure-book-ui
      dockerfile: Dockerfile
    container_name: adventure-frontend
    ports:
      - "80:80"
    depends_on:
      - adventure-backend
    restart: unless-stopped